# Copyright (c) 2026 aderimo. See THIRD-PARTY-NOTICES.md.
#
# Counts compat-list/mods.json again each time a "mod-compat" issue changes (the form the
# "Report how this mod worked" link in Coodsz Host and Coodsz Coop and Friends opens).
#
# The script counts every open and closed report from scratch; a report that gets the
# "invalid" or "spam" label drops out on the next run. Of several reports by one person for
# one mod only the latest counts. works - broken >= 3 makes the status "Works", the other
# way round "Broken"; hand kept entries (the ones with "coop") never change status.
#
# The one click reports the tools send through server/mod-reports-worker arrive as issues with the
# labels mod-report and pending. They count once "pending" is removed, by Coodsz (that unlabel
# runs this workflow) or by the hourly auto approval (auto-approve-reports.yml, which then calls
# this workflow, because a label removed with GITHUB_TOKEN starts no workflow). "taom" and
# "ad1259" reports are left out.
#
# It also writes compat-list/compat-records.json: the approved results as ModderLords compat
# records (Ryvius' format, .github/scripts/compat-records.mjs), Verdict Works or Broken once
# works - broken reaches 3 either way, and MODS.md in the repository root: the readable page of
# the whole list that the tools' Full mod list link opens.
#
# It also runs when compat-list/mods.json or the script is pushed to main (a hand edit or the copy at
# release), so MODS.md is written right after the files are copied over. Its own commit is made
# with GITHUB_TOKEN, which starts no workflow, so it does not loop. In this repository the default
# branch is master, so the push trigger never runs here.
#
# Note: issue events only run the workflow on the default branch.
#
# The tools read the list and open the form in Coodsz/Coodsz-Coop-and-Friends (branch
# main), so this workflow, the script, the form and compat-list/mods.json are copied there
# at release (docs/compat-list-publish.md). In this repository it only keeps the source.

name: Mod compatibility tally

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  push:
    branches: [main]
    paths:
      - compat-list/mods.json
      # The tally and the script it imports.
      - .github/scripts/tally-mod-compat.mjs
      - .github/scripts/compat-records.mjs
  workflow_dispatch:
  # Called by auto-approve-reports.yml after it approved reports.
  workflow_call:

permissions:
  contents: write
  issues: read

# Two tallies never write to the default branch at the same time.
concurrency:
  group: mod-compat-tally
  cancel-in-progress: false

jobs:
  tally:
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'mod-compat') ||
      github.event.label.name == 'mod-compat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Count the reports and write MODS.md
        id: tally
        run: node .github/scripts/tally-mod-compat.mjs --file compat-list/mods.json --page MODS.md --records compat-list/compat-records.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the change to the default branch
        if: steps.tally.outputs.changed == 'true'
        env:
          BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compat-list/mods.json compat-list/compat-records.json MODS.md
          git commit -m "compat-list: update the mod compatibility tally"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
